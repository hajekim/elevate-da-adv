[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cymbal_operations_agent"
version = "0.1.0"
description = "Cymbal Retail Operations Coordinator Agent for Data Analytics Advanced"
authors = [
    {name = "Cymbal Retail Data Engineering", email = "data-eng@cymbalretail.internal"},
]
dependencies = [
    "google-adk[gcp,otel-gcp]>=2.2.0,<3.0.0",
    "mcp>=1.29.0",
    "google-genai>=0.1.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-bigtable>=2.26.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.156.0",
    "google-cloud-secret-manager>=2.20.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "protobuf>=6.31.1,<7.0.0",
    "requests>=2.31.0",
    "google-cloud-bigquery-storage>=2.20.0",
    "pyarrow>=15.0.0",
    "google-cloud-storage>=2.14.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2024.11.0",
    "a2a-sdk[http-server]~=0.3.22",
    "aiohttp>=3.13.4",
    "uvicorn>=0.30.0",
    "fastapi>=0.110.0",
]
requires-python = ">=3.11,<3.14"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.0.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
    "scipy>=1.11.0,<1.15.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
